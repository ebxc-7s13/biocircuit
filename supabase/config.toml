project_id = "biocircuit"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 300
[auth.rate_limit]
sms_sent = 10
token_verifications = 30
sign_in_sign_ups = 20
[functions.scholarly-search]
verify_jwt = true
[functions.account-delete]
verify_jwt = true

[functions.avatar]
verify_jwt = true

[functions.project-images]
verify_jwt = true
